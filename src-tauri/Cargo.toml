[package]
name = "adnd-tools-desktop"
version = "0.2.2"
edition = "2021"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
objc = "0.2"

rquickjs = "0.11"

[features]
diagnostic-harness = []
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
# objc 0.2's exported macros still inspect this legacy Clippy feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
